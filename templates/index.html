<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>📰 Fake News Detector</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>📰 Fake News Detector</h1>
    <form action="{{ url_for('predict') }}" method="POST">
      <textarea name="message" placeholder="Paste your news article here..." required></textarea>
      <button type="submit">Predict</button>
    </form>

    {% if prediction %}
    <div class="result">
      {% if prediction == ['FAKE'] %}
        <p class="fake">⚠ This looks like <strong>FAKE</strong> news</p>
      {% elif prediction == ['REAL'] %}
        <p class="real">✅ This looks like <strong>REAL</strong> news</p>
      {% endif %}
    </div>
    {% endif %}
  </div>
</body>
</html>
